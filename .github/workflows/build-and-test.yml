name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET Core
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: 8.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Install dependencies
        run: dotnet restore

      - name: Check formatting
        run: |
          dotnet fantomas Oryx.Cognite/src/  ./CogniteSdk.FSharp/src --check
          dotnet format --include ./CogniteSdk.Types ./CogniteSdk/src ./CogniteSdk/test/csharp/ --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: ./test.sh
        env:
          TEST_HOST_WRITE: "https://greenfield.cognitedata.com"
          TEST_TENANT_ID_WRITE: ${{ secrets.TEST_TENANT_ID_WRITE }}
          TEST_CLIENT_ID_WRITE: ${{ secrets.TEST_CLIENT_ID_WRITE }}
          TEST_CLIENT_SECRET_WRITE: ${{ secrets.TEST_CLIENT_SECRET_WRITE }}
          TEST_HOST_READ: "https://api.cognitedata.com"
          TEST_TENANT_ID_READ: ${{ secrets.TEST_TENANT_ID_READ }}
          TEST_CLIENT_ID_READ: ${{ secrets.TEST_CLIENT_ID_READ }}
          TEST_CLIENT_SECRET_READ: ${{ secrets.TEST_CLIENT_SECRET_READ }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.lcov
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

  analyze:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        project:
          - CogniteSdk.Types/CogniteSdk.Types.csproj
          - CogniteSdk.Protobuf/CogniteSdk.Protobuf.csproj
          - Oryx.Cognite/src/Oryx.Cognite.fsproj
          - CogniteSdk.FSharp/src/CogniteSdk.FSharp.fsproj
          - CogniteSdk/src/CogniteSdk.csproj

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET Core
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: 8.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Install dependencies
        run: dotnet restore

      - name: Create SARIF output directory
        run: mkdir -p sarif-results

      - name: Compute project name
        run: |
          filename=$(basename "${{ matrix.project }}")
          echo "PROJECT_NAME=${filename%.*}" >> "$GITHUB_ENV"

      # Findings are reported via SARIF, not by failing the build; merge-blocking is
      # handled by a code-scanning branch protection rule instead.
      - name: Run .NET code analysis for ${{ matrix.project }}
        run: |
          case "${{ matrix.project }}" in
            *.fsproj)
              dotnet msbuild /t:AnalyzeFSharpProject "${{ matrix.project }}"
              ;;
            *.csproj)
              dotnet build "${{ matrix.project }}" --configuration Release --no-restore \
                -p:EnableCiAnalysis=true -p:TreatWarningsAsErrors=false
              ;;
          esac

      - name: Verify SARIF report exists
        run: test -f "sarif-results/${{ env.PROJECT_NAME }}.sarif"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: sarif-results/${{ env.PROJECT_NAME }}.sarif
          category: ${{ matrix.project }}
